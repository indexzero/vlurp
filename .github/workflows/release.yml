name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # `changeset publish` runs `pnpm publish`. pnpm 12 publishes without the
      # npm CLI and does the OIDC trusted-publishing token exchange itself, so
      # no npm upgrade step is needed here.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm changeset publish
          github-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          PNPM_CONFIG_PROVENANCE: true
